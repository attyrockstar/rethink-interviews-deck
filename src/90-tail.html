
</div></div>

<div id="hud">
  <span id="count">1 / 1</span>
  <button id="prev" aria-label="Previous slide">Prev</button>
  <button id="next" aria-label="Next slide">Next</button>
  <button id="full" aria-label="Toggle fullscreen">Full screen</button>
</div>

<script>
(function(){
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  slides.forEach(function(el, k){
    var n = el.querySelector('.num');
    if (n) n.textContent = String(k + 1).padStart(2, '0');
  });
  var i = 0, stage = document.getElementById('stage');

  function fit(){
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    stage.style.setProperty('--s', s);
  }

  function show(n){
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach(function(el, k){ el.classList.toggle('on', k === i); });
    document.getElementById('count').textContent = (i + 1) + ' / ' + slides.length;
    document.getElementById('bar').style.width =
      (slides.length > 1 ? (i / (slides.length - 1)) * 100 : 100) + '%';
    try { location.hash = i + 1; } catch(e){}
  }

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); show(i + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(i - 1); }
    else if (e.key === 'Home') { show(0); }
    else if (e.key === 'End') { show(slides.length - 1); }
    else if (e.key === 'f' || e.key === 'F') { toggleFull(); }
  });

  document.getElementById('next').addEventListener('click', function(){ show(i + 1); });
  document.getElementById('prev').addEventListener('click', function(){ show(i - 1); });
  document.getElementById('full').addEventListener('click', toggleFull);

  function toggleFull(){
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
  }

  document.getElementById('deck').addEventListener('click', function(e){
    if (e.target.closest('#hud')) return;
    show(i + 1);
  });

  /* swipe on phones and tablets */
  var tx = null;
  document.addEventListener('touchstart', function(e){ tx = e.changedTouches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', function(e){
    if (tx === null) return;
    var dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 40) show(dx < 0 ? i + 1 : i - 1);
  }, {passive:true});

  var hud = document.getElementById('hud'), hideT;
  function pokeHud(){
    hud.classList.add('show');
    clearTimeout(hideT);
    hideT = setTimeout(function(){ hud.classList.remove('show'); }, 2500);
  }
  document.addEventListener('mousemove', pokeHud);
  document.addEventListener('keydown', pokeHud);
  pokeHud();

  window.addEventListener('resize', fit);
  fit();
  var start = parseInt((location.hash || '').replace('#',''), 10);
  show(isNaN(start) ? 0 : start - 1);
})();
</script>
</body>
</html>
