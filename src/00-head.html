<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approaching Interviews and Solving Case Studies | Rethink Systems</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,800;1,400;1,600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BRAND PALETTE - lifted from rethinksystems.in
   ============================================================ */
:root{
  --ink:       #01061B;   /* Rethink navy: dark slides, body text on light  */
  --paper:     #F3F6FF;   /* light slide background, navy-tinted off-white  */
  --accent:    #3D5BF1;   /* Rethink blue on light slides                   */
  --accent-dk: #84ADFF;   /* Rethink blue on navy slides                    */
  --glow:      #3D5BF1;   /* the hero glow on the website                   */
  --strong:    #0E7A55;   /* the "do this" colour                           */
  --weak:      #B93A22;   /* the "not this" colour on light slides          */
  --weak-dk:   #E07A5F;   /* the "not this" colour on navy slides           */

  /* derived, no need to touch */
  --muted:    #5B6480;
  --hair:     rgba(1,6,27,.14);
  --hair-dk:  rgba(237,237,237,.16);
  --display:  'Figtree','Helvetica Neue',Helvetica,Arial,sans-serif;
  --body:     'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);overflow:hidden}
body{font-family:var(--body);-webkit-font-smoothing:antialiased}

/* ---------- stage scaling: every slide is authored at 1280x720 and scaled as one ---------- */
#deck{position:fixed;inset:0;display:grid;place-items:center}
#stage{width:1280px;height:720px;position:relative;
       transform:scale(var(--s,1));transform-origin:center center}
.slide{position:absolute;inset:0;background:var(--paper);color:var(--ink);
       padding:64px 88px 76px;display:none;flex-direction:column}
.slide.on{display:flex}
.slide.dark{background:var(--ink);color:var(--paper)}

/* ---------- shared type ---------- */
.eyebrow{font-size:15px;font-weight:600;color:var(--accent);letter-spacing:.01em;margin-bottom:14px}
.dark .eyebrow{color:var(--accent-dk)}
h1{font-family:var(--display);font-size:80px;line-height:1.02;font-weight:800;letter-spacing:-.025em}
h2{font-family:var(--display);font-size:46px;line-height:1.08;font-weight:600;letter-spacing:-.02em}
h3{font-family:var(--display);font-size:28px;line-height:1.15;font-weight:600;letter-spacing:-.01em}
.rule{height:0;margin:0 0 34px;flex:none}          /* spacing only, no drawn line */
.lede{font-size:26px;line-height:1.5;max-width:62ch;color:var(--muted)}
.dark .lede{color:rgba(243,246,255,.66)}
.body{font-size:24px;line-height:1.55;max-width:66ch}
.fill{flex:1 1 auto;min-height:0}
.asof{font-size:14px;color:var(--muted);margin-top:auto;padding-top:18px}
.dark .asof{color:rgba(243,246,255,.45)}

/* statement slide */
.statement{font-family:var(--display);font-size:60px;line-height:1.12;font-weight:600;
           letter-spacing:-.02em;max-width:20ch}
.statement em{font-style:normal;color:var(--accent-dk)}
.attrib{font-size:20px;color:rgba(243,246,255,.6);margin-top:34px;max-width:70ch;line-height:1.5}
.attrib em{font-style:italic}

/* part divider */
.divider{justify-content:center}
.partnum{font-family:var(--display);font-size:210px;line-height:.8;font-weight:800;
         color:transparent;-webkit-text-stroke:2px var(--accent-dk);letter-spacing:-.04em}
.parttitle{font-family:var(--display);font-size:58px;font-weight:600;letter-spacing:-.025em;margin-top:18px}
.partnote{font-size:22px;color:rgba(243,246,255,.6);margin-top:20px;max-width:46ch;line-height:1.5}

/* numbered / bulleted lists */
ol.steps{list-style:none;display:flex;flex-direction:column;gap:22px;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:46px 1fr;gap:20px;align-items:start}
ol.steps li::before{content:counter(s);font-family:var(--display);font-size:30px;font-weight:600;
                    color:var(--accent);line-height:1.1}
.dark ol.steps li::before{color:var(--accent-dk)}
ol.steps .t{font-size:25px;font-weight:600;line-height:1.3}
ol.steps .d{font-size:21px;color:var(--muted);line-height:1.45;margin-top:5px;max-width:72ch}
.dark ol.steps .d{color:rgba(243,246,255,.62)}

ul.plain{list-style:none;display:flex;flex-direction:column;gap:17px}
ul.plain li{font-size:24px;line-height:1.4;padding-left:26px;position:relative}
ul.plain li::before{content:"";position:absolute;left:0;top:12px;width:9px;height:2px;border-radius:2px;background:var(--accent)}
.dark ul.plain li::before{background:var(--accent-dk)}
ul.plain li span{color:var(--muted);font-size:20px;display:block;margin-top:4px;line-height:1.45}
.dark ul.plain li span{color:rgba(243,246,255,.62)}

/* two-column compare: weak vs strong */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:0;flex:1;min-height:0}
.compare > div{padding:6px 40px}
.compare > div:first-child{padding-left:0;border-right:1px solid var(--hair)}
.dark .compare > div:first-child{border-right-color:var(--hair-dk)}
.compare > div:last-child{padding-right:0}
.tag{font-size:16px;font-weight:600;margin-bottom:16px}
.tag.w{color:var(--weak)}
.tag.s{color:var(--strong)}
.dark .tag.w{color:var(--weak-dk)}
.dark .tag.s{color:#6FCFA6}
.quote{font-size:21px;line-height:1.5}
.quote + .tag{margin-top:30px}
.note{font-size:19px;color:var(--muted);line-height:1.45;margin-top:18px}
.dark .note{color:rgba(243,246,255,.78)}
.callout{border-left:3px solid var(--strong);padding-left:24px}
.callout.w{border-left-color:var(--weak)}

/* attribute / concept grid */
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--hair);
       border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);flex:1;min-height:0}
.grid5 > div{background:var(--paper);padding:28px 22px;display:flex;flex-direction:column}
.grid5 .n{font-family:var(--display);font-size:22px;font-weight:600;color:var(--accent);margin-bottom:12px}
.grid5 .h{font-size:23px;font-weight:600;line-height:1.25}
.grid5 .p{font-size:18px;color:var(--muted);line-height:1.45;margin-top:11px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px 54px;flex:1;min-height:0;align-content:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:30px 44px;flex:1;min-height:0;align-content:start}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:30px 36px;flex:1;min-height:0;align-content:start}
.cell .h{font-size:23px;font-weight:600;line-height:1.3;margin-bottom:9px}
.cell .p{font-size:20px;color:var(--muted);line-height:1.5}
.dark .cell .p{color:rgba(243,246,255,.62)}
.cell .k{font-size:15px;font-weight:600;color:var(--accent);margin-bottom:9px}
.dark .cell .k{color:var(--accent-dk)}

/* mapping table */
table.map{width:100%;border-collapse:collapse;font-size:20px}
table.map th{text-align:left;font-weight:600;font-size:15px;color:var(--accent);
             padding:0 0 14px;border-bottom:1px solid var(--hair)}
table.map td{padding:16px 0;border-bottom:1px solid var(--hair);vertical-align:top;line-height:1.35}
table.map td:last-child{color:var(--muted);padding-left:40px}
table.map.tight td{padding:11px 0}

/* big-number stat rows (India figures) */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0 34px;flex:1;min-height:0;align-content:center}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stat .n{font-family:var(--display);font-size:74px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--accent);white-space:nowrap}
.dark .stat .n{color:var(--accent-dk)}
.stat .n small{font-size:30px;font-weight:600;letter-spacing:-.01em;margin-left:6px}
.stat .l{font-size:19px;line-height:1.35;margin-top:14px;max-width:24ch}
.dark .stat .l{color:rgba(243,246,255,.88)}
.stat .s{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.35}
.dark .stat .s{color:rgba(243,246,255,.5)}

/* "nobody:" text meme */
.nobody{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:34px}
.nobody .who{font-size:22px;font-weight:600;color:var(--muted)}
.dark .nobody .who{color:rgba(243,246,255,.55)}
.nobody .say{font-family:var(--display);font-size:38px;font-weight:800;line-height:1.18;letter-spacing:-.02em;max-width:26ch;margin-top:8px}
.nobody .say.long{font-size:28px;font-weight:600;line-height:1.35;max-width:44ch;letter-spacing:-.01em}

/* ledger (the MBA maths) */
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:0 70px;flex:1;min-height:0;align-content:center}
.ledger .row{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:15px 0;border-bottom:1px solid var(--hair)}
.dark .ledger .row{border-bottom-color:var(--hair-dk)}
.ledger .row .k{font-size:20px;line-height:1.3}
.ledger .row .k span{display:block;font-size:14px;color:var(--muted);margin-top:3px}
.dark .ledger .row .k span{color:rgba(243,246,255,.5)}
.ledger .row .v{font-family:var(--display);font-size:32px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.ledger .row.total .v{color:var(--accent)} .dark .ledger .row.total .v{color:var(--accent-dk)}
.ledger .head{font-size:15px;font-weight:600;color:var(--accent);padding-bottom:10px}
.dark .ledger .head{color:var(--accent-dk)}

/* recap rules */
.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 30px;flex:1;min-height:0;align-content:center}
.rules .r .n{font-family:var(--display);font-size:54px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--accent-dk)}
.rules .r .t{font-size:19px;line-height:1.35;margin-top:10px;max-width:22ch}

/* one-page assignment skeleton */
.skel{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--hair);border:1px solid var(--hair);flex:1;min-height:0}
.skel > div{background:var(--paper);padding:20px 22px}
.skel .k{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:8px}
.skel .h{font-size:19px;font-weight:600;line-height:1.3}
.skel .p{font-size:16px;color:var(--muted);line-height:1.4;margin-top:7px}

/* illustrations */
.illo{width:100%;height:auto;display:block;overflow:visible}
.illo .ln{stroke:currentColor;fill:none;stroke-width:2;opacity:.5;
          stroke-linecap:round;stroke-linejoin:round}
.illo .ln.faint{opacity:.22}
.illo .ln.solid{opacity:.85}
.illo .hi{stroke:var(--accent);fill:none;stroke-width:2.5;
          stroke-linecap:round;stroke-linejoin:round}
.dark .illo .hi{stroke:var(--accent-dk)}
.illo .hif{fill:var(--accent)}
.dark .illo .hif{fill:var(--accent-dk)}
.illo .sf{fill:currentColor;opacity:.07}
.illo .lbl{fill:currentColor;font-family:var(--body);font-size:18px;font-weight:500}
.illo .lbl.dim{opacity:.55;font-weight:400}
.illo .lbl.sm{font-size:15px;opacity:.5;font-weight:400}
.illo .lbl.b{font-weight:600}
.illo .wk{stroke:var(--weak-dk);fill:none;stroke-width:2.5;stroke-linecap:round}
.illo .wkf{fill:var(--weak-dk)}
.illo .lblwk{fill:var(--weak-dk);font-family:var(--body);font-size:18px;font-weight:600}
.illo .lblhi{fill:var(--accent);font-family:var(--body);font-size:18px;font-weight:600}
.dark .illo .lblhi{fill:var(--accent-dk)}
.illo .say{fill:currentColor;font-family:var(--body);font-size:22px;font-weight:500;opacity:.92}
.illo .bub{stroke:currentColor;fill:none;stroke-width:2;opacity:.55;stroke-linejoin:round}
.illo .bub.hi{stroke:var(--accent);opacity:1}
.dark .illo .bub.hi{stroke:var(--accent-dk)}
.illostage{flex:1;display:flex;align-items:center;min-height:0;padding:4px 0}
.illo .dot{fill:var(--accent)} .dark .illo .dot{fill:var(--accent-dk)}
.illo .dot.off{fill:none;stroke:currentColor;stroke-width:1.5;opacity:.35}

/* footer */
.foot{position:absolute;left:88px;right:88px;bottom:30px;display:flex;justify-content:space-between;
      align-items:center;font-size:14px;color:var(--muted);letter-spacing:.01em}
.dark .foot{color:rgba(243,246,255,.42)}
.foot .mark{font-family:var(--display);font-weight:800;color:var(--ink);letter-spacing:-.01em}
.foot .mark i{font-style:normal;font-weight:400;letter-spacing:.16em;margin-left:4px}
.dark .foot .mark{color:rgba(243,246,255,.8)}
.slide.cover .foot,.slide.divider .foot,.slide.end .foot{display:none}

/* cover + part dividers: the rethinksystems.in hero, navy with the blue glow rising from the floor */
.cover,.divider,.end{
  background:
    radial-gradient(ellipse 84% 70% at 50% 116%, rgba(132,173,255,.85) 0%, rgba(61,91,241,.9) 22%, rgba(61,91,241,.42) 48%, rgba(1,6,27,0) 74%),
    var(--ink);
  color:var(--paper)}
.cover{justify-content:flex-end;padding-bottom:88px;overflow:hidden}
.cover::before,.end::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(132,173,255,.42) 1.1px, transparent 1.6px);
  background-size:22px 22px;
  -webkit-mask-image:radial-gradient(ellipse 58% 66% at 50% 92%, #000 0%, rgba(0,0,0,.5) 45%, transparent 78%);
          mask-image:radial-gradient(ellipse 58% 66% at 50% 92%, #000 0%, rgba(0,0,0,.5) 45%, transparent 78%)}
.cover > *,.end > *{position:relative}
.cover .kicker{font-size:17px;font-weight:600;color:var(--accent-dk);margin-bottom:auto}
.cover h1{max-width:17ch;margin-bottom:34px}
.cover .by{font-size:23px;color:rgba(243,246,255,.72)}
.cover .by b{font-weight:600;color:var(--paper)}
.cover .accentbar{width:86px;height:5px;border-radius:3px;background:var(--accent-dk);margin-bottom:40px}
.end{justify-content:center;align-items:flex-start;overflow:hidden}
.end h1{max-width:14ch}
.end .by{font-size:24px;color:rgba(243,246,255,.72);margin-top:28px}

/* progress + hud */
#bar{position:fixed;left:0;top:0;height:3px;background:var(--accent-dk);width:0;z-index:40;transition:width .18s ease}
#hud{position:fixed;right:18px;bottom:16px;z-index:40;font-family:var(--body);font-size:12px;
     color:rgba(255,255,255,.45);display:flex;gap:14px;align-items:center;
     opacity:0;transition:opacity .25s ease;pointer-events:none}
#hud.show{opacity:1;pointer-events:auto}
#hud button{background:none;border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.6);
            font:inherit;padding:5px 11px;border-radius:2px;cursor:pointer}
#hud button:hover{border-color:rgba(255,255,255,.5);color:#fff}
#hud button:focus-visible{outline:2px solid var(--accent-dk);outline-offset:2px}

@media print{
  html,body{overflow:visible;background:#fff}
  #deck,#stage{position:static;transform:none;width:auto;height:auto;box-shadow:none;display:block}
  #bar,#hud{display:none}
  .slide{display:flex !important;position:relative;width:1280px;height:720px;page-break-after:always;
         break-after:page;box-shadow:none}
  @page{size:1280px 720px;margin:0}
}
@media (prefers-reduced-motion:reduce){#bar{transition:none}}
</style>
</head>

<div id="bar"></div>

<!-- Shared line-art symbols: one stick figure, reused across every comic so the hand stays the same -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- standing figure, 60x130 box, head at top centre -->
    <symbol id="fig" viewBox="0 0 60 130" overflow="visible">
      <circle cx="30" cy="16" r="13"/>
      <path d="M30 29 V82"/>
      <path d="M30 46 L9 70"/><path d="M30 46 L51 70"/>
      <path d="M30 82 L13 126"/><path d="M30 82 L47 126"/>
    </symbol>
    <!-- slumped figure: shoulders down, one arm hanging -->
    <symbol id="fig-sad" viewBox="0 0 60 130" overflow="visible">
      <circle cx="30" cy="20" r="13"/>
      <path d="M30 33 V84"/>
      <path d="M30 52 L14 84"/><path d="M30 52 L46 84"/>
      <path d="M30 84 L15 126"/><path d="M30 84 L45 126"/>
    </symbol>
    <!-- figure with one arm raised (pointing / presenting) -->
    <symbol id="fig-up" viewBox="0 0 60 130" overflow="visible">
      <circle cx="30" cy="16" r="13"/>
      <path d="M30 29 V82"/>
      <path d="M30 46 L9 70"/><path d="M30 46 L56 26"/>
      <path d="M30 82 L13 126"/><path d="M30 82 L47 126"/>
    </symbol>
  </defs>
</svg>

<div id="deck"><div id="stage">
